<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9f8"><title>Pausa — Mudar de foco</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="./css/app.css"><style>.focus-page{min-height:100vh;display:grid;place-items:center;padding:35px 15px}.focus-box{width:min(100%,620px);text-align:center}.timer-ring{width:180px;height:180px;margin:30px auto;display:grid;place-items:center;border:10px solid #dfece5;border-top-color:var(--pausa-primary);border-radius:50%;font:800 2.8rem 'Manrope',sans-serif}.focus-box p{color:var(--pausa-text-soft);max-width:480px;margin:0 auto 25px}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:25px}.choice{padding:18px;background:#fff;border:1px solid var(--pausa-border);border-radius:17px;font-weight:700;text-align:left}.choice i{color:var(--pausa-primary);margin-right:8px}@media(max-width:500px){.choice-grid{grid-template-columns:1fr}}</style></head>
<body><main class="focus-page"><div class="focus-box"><a class="brand justify-content-center" href="./dashboard.html"><span class="brand-mark"><i class="bi bi-pause-fill"></i></span><span>Pausa</span></a><span class="eyebrow mt-5">SÓ POR AGORA</span><h1 class="mt-2">Vamos dar espaço para o momento passar.</h1><div class="timer-ring" id="timer">03:00</div><p>Respire, afaste-se do gatilho se puder e deixe o relógio trabalhar por você. Você não precisa lutar contra o sentimento — apenas esperar antes de agir.</p><div class="d-flex justify-content-center gap-2"><button class="btn btn-primary px-4" id="startTimer">Começar</button><a class="btn btn-soft px-4" href="./dashboard.html">Voltar</a></div><div class="choice-grid"><button class="choice"><i class="bi bi-music-note-beamed"></i>Ouvir música</button><button class="choice"><i class="bi bi-pencil"></i>Desenhar</button><button class="choice"><i class="bi bi-controller"></i>Jogar</button><button class="choice"><i class="bi bi-book"></i>Ler alguma coisa</button></div></div></main><script>let seconds=180,interval=null;const timer=document.getElementById('timer'),button=document.getElementById('startTimer');button.addEventListener('click',()=>{if(interval)return;button.textContent='Em andamento';interval=setInterval(()=>{seconds--;timer.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;if(seconds<=0){clearInterval(interval);interval=null;button.textContent='Recomeçar';seconds=180;}},1000)});</script></body></html>
